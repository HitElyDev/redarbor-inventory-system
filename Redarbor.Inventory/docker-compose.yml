version: '3.8'
services:
  inventory-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ChallengeNetHitg!2026
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - ./sql-scripts:/docker-entrypoint-initdb.d

  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=Server=inventory-db;Database=InventoryDb;User Id=sa;Password=ChallengeNetHitg!2026;TrustServerCertificate=True;
    depends_on:
      - inventory-db